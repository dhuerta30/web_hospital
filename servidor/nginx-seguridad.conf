# =============================================================================
#  Hospital San José de Melipilla — bloque server de Nginx
#  Equivalente al .htaccess entregado. Usar sólo si el sitio corre sobre Nginx.
#  INF-CIBER-2026-10, remediación 6.1 / 6.2 / 6.6
# =============================================================================

# --- Redirección obligatoria a HTTPS (hallazgo 4.1) --------------------------
server {
    listen 80;
    server_name hospitaldemelipilla.cl www.hospitaldemelipilla.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hospitaldemelipilla.cl www.hospitaldemelipilla.cl;

    root /home/USUARIO/public_html;
    index index.php;

    # --- TLS (hallazgo 4.8) --------------------------------------------------
    ssl_certificate     /ruta/al/fullchain.pem;
    ssl_certificate_key /ruta/al/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;   # TLS 1.0 y 1.1 deshabilitados
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Cabeceras de seguridad (hallazgo 4.4) -------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP: desplegar PRIMERO en modo sólo-reporte, revisar la consola del
    # navegador durante unos días y recién entonces cambiar a modo enforce.
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    server_tokens off;   # ocultar la versión del servidor

    # --- Archivos que nunca deben servirse -----------------------------------
    location ~ /\.(env|git|htaccess|htpasswd) { deny all; return 404; }
    location ~* \.(log|sql|bak|backup|old|orig|ini|lock|sh)$ { deny all; return 404; }
    location = /error_log { deny all; return 404; }
    location = /composer.json { deny all; return 404; }
    location = /composer.lock { deny all; return 404; }

    location ^~ /vendor/       { deny all; return 404; }
    location ^~ /node_modules/ { deny all; return 404; }
    location ^~ /app/core/     { deny all; return 404; }
    location ^~ /app/Models/   { deny all; return 404; }
    location ^~ /app/Services/ { deny all; return 404; }
    location ^~ /app/Console/  { deny all; return 404; }

    # --- Directorio de cargas (hallazgo 4.2) ---------------------------------
    location ^~ /app/libs/artify/uploads/ {
        autoindex off;                       # sin listado de directorio
        location ~ \.(php|phtml|phar|cgi|pl|py|sh)$ {
            deny all;                        # jamás ejecutar scripts aquí
            return 404;
        }
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Enrutamiento de la aplicación ---------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }
}
